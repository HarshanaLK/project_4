server:
  port: ${PORT:8080}

spring:
  application:
    name: synapse-collab-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/synapse_collab?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:synapse}
    password: ${DB_PASSWORD:synapse123}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  cors:
    origins: ${APP_CORS_ORIGINS:http://localhost:3000}
